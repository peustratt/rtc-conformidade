name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    # A primeira etapa com calculadora compila as duas a partir do código-fonte (alguns minutos).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restaurar pacotes
        run: dotnet restore

      - name: Compilar
        run: dotnet build --no-restore --configuration Release

      # Formato dos casos e checagens das invariantes com respostas escritas à mão: falham rápido.
      - name: Testar sem as calculadoras
        run: dotnet test --no-build --configuration Release --filter "Requer!=calculadora" --logger "console;verbosity=normal"

      # Os testes sobem as calculadoras oficiais em containers (Testcontainers), nas versões
      # fixadas em calculadoras/Dockerfile.
      - name: Testar contra as calculadoras
        run: dotnet test --no-build --configuration Release --filter "Requer=calculadora" --logger "console;verbosity=normal"
