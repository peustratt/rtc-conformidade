name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restaurar pacotes
        run: dotnet restore

      - name: Compilar
        run: dotnet build --no-restore --configuration Release

      # Os testes marcados com Requer=calculadora ficam de fora até as calculadoras
      # subirem no CI com Testcontainers (semana 2).
      - name: Testar
        run: dotnet test --no-build --configuration Release --filter "Requer!=calculadora" --logger "console;verbosity=normal"
